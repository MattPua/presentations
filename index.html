<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matt Pua's presentations</title>
    <style>
      :root { color: #1d1f20; background: #f7f7f3; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 3rem 1.5rem; }
      main { width: min(720px, 100%); }
      p { color: #6b6d68; font-size: 1.125rem; line-height: 1.5; }
      h1 { font-size: clamp(3rem, 9vw, 5.5rem); letter-spacing: -0.07em; line-height: 0.9; margin: 0; }
      .eyebrow { color: #f54e00; font-size: 0.875rem; font-weight: 800; letter-spacing: 0.08em; margin-bottom: 1.25rem; text-transform: uppercase; }
      ul { display: grid; gap: 1rem; list-style: none; margin: 3rem 0 0; padding: 0; }
      a { background: white; border: 2px solid #1d1f20; border-radius: 1rem; box-shadow: 7px 7px 0 #d8d9d4; color: inherit; display: block; padding: 1.25rem 1.5rem; text-decoration: none; transition: transform 120ms ease, box-shadow 120ms ease; }
      a:hover, a:focus-visible { box-shadow: 2px 2px 0 #d8d9d4; transform: translate(5px, 5px); }
      .date { color: #f54e00; display: block; font-size: 0.875rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
      .title { display: block; font-size: 1.5rem; font-weight: 800; margin-top: 0.25rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Matt Pua</div>
      <h1>Presentations</h1>
      <p>A growing collection of talks and decks.</p>
      <ul>
        <li>
          <a href="2026-09-15-self-driving-support/dist/">
            <span class="date">September 15, 2026</span>
            <span class="title">Self-driving support</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
